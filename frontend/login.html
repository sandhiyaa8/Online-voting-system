<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Tamil Nadu Voting System</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="container">
    <h1 style="font-size: 28px; font-weight: 400; text-align: center; margin: 0 0 8px 0; color: var(--text-primary);">Sign in</h1>
    <p class="text-center text-muted" style="margin-bottom: 32px;">Tamil Nadu Online Voting System</p>

    <form id="loginForm">
        <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username" aria-label="Username">
        <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" aria-label="Password">
        
        <div class="button-group">
            <a href="register.html" class="btn btn-text">Create account</a>
            <button type="submit" class="btn btn-primary">Next</button>
        </div>
    </form>
</div>

<footer style="text-align: center; padding: 24px; color: var(--text-secondary); font-size: 12px;">
    <a href="index.html" style="margin: 0 8px;">Home</a>
    <a href="results.html" style="margin: 0 8px;">Results</a>
    <p style="margin-top: 8px; color: #80868b;">Built by Sandhiya, Sindhiya & Pranesh</p>
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Online Voting System</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header style="background: white; border-bottom: 1px solid var(--border-color); padding: 16px 24px;">
    <div style="max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <span style="font-size: 20px; font-weight: 500; color: var(--text-primary);">Online Voting</span>
        </div>
        <div style="display: flex; gap: 8px;">
            <button onclick="window.location.href='results.html'" class="btn btn-text">Results</button>
            <button onclick="logout()" class="btn btn-text">Sign out</button>
        </div>
    </div>
</header>

<div style="max-width: 800px; margin: 32px auto; padding: 0 24px;">
    <h1 style="font-size: 28px; font-weight: 400; margin: 0 0 8px 0; color: var(--text-primary);">Your Dashboard</h1>
    <p style="color: var(--text-secondary); margin: 0 0 32px 0;">Select an election to participate</p>

    <div style="background: #e8f0fe; border: 1px solid #1a73e8; border-radius: 8px; padding: 16px 20px; margin-bottom: 32px;">
        <div style="color: var(--google-blue); font-weight: 500; margin-bottom: 4px;">Important</div>
        <div style="color: var(--text-secondary); font-size: 14px;">You can only vote once per election. Choose carefully!</div>
    </div>

    <div style="display: grid; gap: 16px;">
        <div style="background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 24px; cursor: pointer; transition: box-shadow 0.2s;" onclick="window.location.href='vote.html'" onmouseover="this.style.boxShadow='var(--shadow-2)'" onmouseout="this.style.boxShadow='none'">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-size: 18px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px;">Assembly Election</div>
                    <div style="color: var(--text-secondary); font-size: 14px;">Vote for your MLA representative</div>
                </div>
                <button class="btn btn-primary" style="pointer-events: none;">Vote now</button>
            </div>
        </div>

        <div style="background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 24px; opacity: 0.5;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-size: 18px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px;">Local Body Election</div>
                    <div style="color: var(--text-secondary); font-size: 14px;">Coming soon</div>
                </div>
                <button class="btn" style="background: var(--google-grey-300); color: var(--text-secondary); pointer-events: none;">Upcoming</button>
            </div>
        </div>

        <div style="background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 24px; opacity: 0.5;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-size: 18px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px;">Parliamentary Election</div>
                    <div style="color: var(--text-secondary); font-size: 14px;">Coming soon</div>
                </div>
                <button class="btn" style="background: var(--google-grey-300); color: var(--text-secondary); pointer-events: none;">Upcoming</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>0
